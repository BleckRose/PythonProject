<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар | MODA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="container header-inner">
            <a href="{{ url_for('index') }}" class="logo">MO<span>DA</span></a>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Главная</a></li>
                    <li><a href="{{ url_for('index') }}#catalog">Каталог</a></li>
                    <li><a href="{{ url_for('favorites') }}">Избранное</a></li>
                    <li><a href="{{ url_for('orders') }}">Мои заказы</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <span class="user-greeting"></span>
                <a href="{{ url_for('favorites') }}">♡<span class="counter fav-counter" style="display:none;">0</span></a>
                <a href="{{ url_for('cart') }}">🛒<span class="counter cart-counter" style="display:none;">0</span></a>
                <a href="{{ url_for('login') }}" class="login-link">👤</a>
                <a href="#" class="logout-link" onclick="handleLogout(event)" style="display:none;">🚪</a>
            </div>
        </div>
    </header>

    <main>
        <section class="product-page">
            <div class="container">
                <a href="{{ url_for('index') }}#catalog" class="back-link">← Назад в каталог</a>
                <div id="productPageRoot" data-product-id="{{ product_id }}"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col"><h4>MODA</h4><p>Магазин стильной одежды.</p></div>
                <div class="footer-col"><h4>Покупателям</h4>
                    <ul>
                        <li><a href="{{ url_for('cart') }}">Корзина</a></li>
                        <li><a href="{{ url_for('favorites') }}">Избранное</a></li>
                        <li><a href="{{ url_for('orders') }}">Мои заказы</a></li>
                    </ul>
                </div>
                <div class="footer-col"><h4>Аккаунт</h4>
                    <ul>
                        <li><a href="{{ url_for('login') }}">Вход</a></li>
                        <li><a href="{{ url_for('register') }}">Регистрация</a></li>
                    </ul>
                </div>
                <div class="footer-col"><h4>Контакты</h4><p>+7 (495) 123-45-67</p></div>
            </div>
        </div>
        <div class="footer-bottom"><div class="container">© 2026 MODA. Все права защищены.</div></div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        const productId = parseInt(document.getElementById('productPageRoot').dataset.productId, 10);
        const p = getProduct(productId);

        if (!p) {
            document.getElementById('productPageRoot').innerHTML = `
                <div class="empty-state">
                    <div class="icon">🚫</div>
                    <h3>Товар не найден</h3>
                    <p>Возможно, он был удалён или вы перешли по неверной ссылке</p>
                    <a href="{{ url_for('index') }}" class="btn">На главную</a>
                </div>`;
        } else {
            const discount = p.oldPrice
                ? Math.round((1 - p.price / p.oldPrice) * 100)
                : 0;

            const inCart = isInCart(p.id);
            const fav = isFavorite(p.id);

            document.getElementById('productPageRoot').innerHTML = `
                <div class="product-page-inner">
                    <div class="product-page-image">
                        ${p.badge ? `<span class="badge ${p.badge === 'NEW' ? 'new' : ''}" style="top:20px;left:20px;">${p.badge}</span>` : ''}
                        <img src="${p.image}" alt="${p.name}">
                    </div>

                    <div class="product-page-info">
                        <div class="product-page-category">${p.category}</div>
                        <h1>${p.name}</h1>

                        <div class="product-page-price">
                            <span class="current">${formatPrice(p.price)}</span>
                            ${p.oldPrice ? `<span class="old">${formatPrice(p.oldPrice)}</span>` : ''}
                            ${discount ? `<span class="discount">−${discount}%</span>` : ''}
                        </div>

                        <div class="product-page-section">
                            <h3>Описание</h3>
                            <p class="product-page-description">${p.description}</p>
                        </div>

                        <div class="product-page-section">
                            <h3>Выберите размер</h3>
                            <div class="size-options" id="sizeOptions">
                                ${p.sizes.map(s => `<button class="size-option" data-size="${s}">${s}</button>`).join('')}
                            </div>
                        </div>

                        <div class="product-page-section">
                            <h3>Характеристики</h3>
                            <ul class="product-specs">
                                <li><span>Состав</span><span>${p.composition}</span></li>
                                <li><span>Страна</span><span>${p.country}</span></li>
                                <li><span>Категория</span><span>${p.category}</span></li>
                            </ul>
                        </div>

                        <div class="product-page-actions">
                            <button id="productAddBtn"
                                    class="btn ${inCart ? 'in-cart' : ''}"
                                    data-product-id="${p.id}">
                                ${inCart ? '✕ Убрать из корзины' : 'Добавить в корзину'}
                            </button>
                            <button class="fav-btn-big ${fav ? 'active' : ''}"
                                    id="productFavBtn"
                                    title="В избранное">
                                ${fav ? '♥' : '♡'}
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Кнопка «Добавить/Убрать из корзины»
            const addBtn = document.getElementById('productAddBtn');
            if (inCart) {
                addBtn.onclick = () => removeFromCart(p.id);
            } else {
                addBtn.onclick = () => addToCart(p.id);
            }

            // Кнопка «В избранное»
            const favBtn = document.getElementById('productFavBtn');
            favBtn.onclick = () => {
                toggleFavorite(p.id);
                const nowFav = isFavorite(p.id);
                favBtn.classList.toggle('active', nowFav);
                favBtn.innerHTML = nowFav ? '♥' : '♡';
            };

            // Выбор размера
            document.querySelectorAll('.size-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.size-option').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });
        }

        updateCounters();
        renderUserGreeting();
    </script>
</body>
</html>
