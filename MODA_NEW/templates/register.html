<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | MODA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="{{ url_for('index') }}" class="logo">MO<span>DA</span></a>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}" class="active">Главная</a></li>
                    <li><a href="{{ url_for('index') }}#catalog">Каталог</a></li>
                    <li><a href="{{ url_for('favorites') }}">Избранное</a></li>
                    <li><a href="{{ url_for('orders') }}">Мои заказы</a></li>
                </ul>
            </nav>
        <div class="header-icons">
            <a href="{{ url_for('favorites') }}">♡<span class="counter fav-counter">0</span></a>
            <a href="{{ url_for('cart') }}">🛒<span class="counter cart-counter">0</span></a>
            <a href="{{ url_for('login') }}" class="login-link">👤</a>
        </div>
        </div>
    </header>
    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Создать аккаунт</h2>
            <p class="subtitle">Присоединяйтесь к MODA и получите скидку 20%</p>
            <div id="alertBox" class="alert"></div>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input type="text" id="name" placeholder="Ваше имя" required>
                    <div class="form-error" id="nameError">Введите имя</div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                    <div class="form-error" id="emailError">Введите корректный email</div>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Минимум 6 символов" required>
                    <div class="form-error" id="passwordError">Пароль должен содержать минимум 6 символов</div>
                </div>
                <div class="form-group">
                    <label for="confirm">Подтвердите пароль</label>
                    <input type="password" id="confirm" placeholder="Повторите пароль" required>
                    <div class="form-error" id="confirmError">Пароли не совпадают</div>
                </div>
                <button type="submit" class="btn btn-block">Зарегистрироваться</button>
            </form>
            <div class="auth-footer">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        const form = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        function showAlert(msg, type = 'error') {
            alertBox.textContent = msg;
            alertBox.className = 'alert show alert-' + type;
        }
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            // Валидация
            ['nameError','emailError','passwordError','confirmError'].forEach(id =>
                document.getElementById(id).classList.remove('show')
            );
            let hasError = false;
            if (name.length < 2) {
                document.getElementById('nameError').classList.add('show');
                hasError = true;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('emailError').classList.add('show');
                hasError = true;
            }
            if (password.length < 6) {
                document.getElementById('passwordError').classList.add('show');
                hasError = true;
            }
            if (password !== confirm) {
                document.getElementById('confirmError').classList.add('show');
                hasError = true;
            }
            if (hasError) return;
            const users = getUsers();
            if (users.some(u => u.email === email)) {
                showAlert('Пользователь с таким email уже зарегистрирован');
                return;
            }
            users.push({ name, email, password });
            saveUsers(users);
            setCurrentUser({ name, email });
            showAlert('Регистрация успешна! Перенаправление...', 'success');
            setTimeout(() => window.location.href = "{{ url_for('index') }}", 900);
        });
    </script>
</body>
</html>
