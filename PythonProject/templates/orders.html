<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы | MODA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">MO<span>DA</span></a>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#catalog">Каталог</a></li>
                    <li><a href="/favorites">Избранное</a></li>
                    <li><a href="/orders" class="active">Мои заказы</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <span class="user-greeting"></span>
                <a href="/favorites" title="Избранное">♡<span class="counter fav-counter" style="display:none;">0</span></a>
                <a href="/cart" title="Корзина">🛒<span class="counter cart-counter" style="display:none;">0</span></a>
                <a href="/login" class="login-link" title="Войти">👤</a>
                <a href="#" class="logout-link" onclick="handleLogout(event)" title="Выйти" style="display:none;">🚪</a>
            </div>
        </div>
    </header>

    <main>
        <section class="cart-section">
            <div class="container">
                <div class="section-title">
                    <h2>Мои заказы</h2>
                    <p>История ваших покупок</p>
                    <div class="divider"></div>
                </div>
                <div id="ordersContent"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col"><h4>MODA</h4><p>Магазин стильной одежды.</p></div>
                <div class="footer-col"><h4>Покупателям</h4>
                    <ul><li><a href="/cart">Корзина</a></li><li><a href="/favorites">Избранное</a></li><li><a href="orders.html">Мои заказы</a></li></ul>
                </div>
                <div class="footer-col"><h4>Аккаунт</h4>
                    <ul><li><a href="/login">Вход</a></li><li><a href="/register">Регистрация</a></li></ul>
                </div>
                <div class="footer-col"><h4>Контакты</h4><p>+7 (495) 123-45-67</p></div>
            </div>
        </div>
        <div class="footer-bottom"><div class="container">© 2026 MODA. Все права защищены.</div></div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        function renderOrders() {
            const user = getCurrentUser();
            const container = document.getElementById('ordersContent');

            if (!user) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔒</div>
                        <h3>Требуется вход</h3>
                        <p>Войдите, чтобы посмотреть свои заказы</p>
                        <a href="/login" class="btn">Войти</a>
                    </div>`;
                return;
            }

            const allOrders = getOrders();
            const myOrders = allOrders.filter(o => o.email === user.email);

            if (myOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <h3>Заказов пока нет</h3>
                        <p>Оформите первый заказ — и он появится здесь</p>
                        <a href="index.html" class="btn">Перейти в каталог</a>
                    </div>`;
                return;
            }

            container.innerHTML = myOrders.map(order => {
                const statusMap = {
                    pending: { text: 'Ожидает оплаты', cls: 'status-pending' },
                    paid: { text: 'Оплачен', cls: 'status-paid' },
                    delivered: { text: 'Доставлен', cls: 'status-delivered' }
                };
                const st = statusMap[order.status] || statusMap.pending;

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-number">Заказ ${order.id}</div>
                                <div class="order-date">${order.date}</div>
                            </div>
                            <span class="order-status ${st.cls}">${st.text}</span>
                        </div>
                        <div class="order-items-list">
                            ${order.items.map(i => `
                                <div class="order-item-row">
                                    <img src="${i.image}" alt="${i.name}">
                                    <span class="name">${i.name}</span>
                                    <span class="qty">× ${i.quantity}</span>
                                    <span class="price">${formatPrice(i.price * i.quantity)}</span>
                                </div>`).join('')}
                        </div>
                        <div class="order-total-row">
                            <span class="label">Оплата: ${order.payment}</span>
                            <span class="value">${formatPrice(order.total)}</span>
                        </div>
                    </div>`;
            }).join('');
        }

        renderOrders();
    </script>
</body>
</html>
